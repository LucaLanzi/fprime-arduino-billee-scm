[fprime]
project_root: .
framework_path: ./lib/fprime

library_locations: ./lib/fprime-arduino:./lib/fprime-baremetal:./lib/fprime-billee-scm:./lib/vendor-lib
default_toolchain: teensy41

# Forked from fprime-community/fprime-arduino-deployment-cookiecutter with
# two config-generation bugs fixed (FpConfig.h macro/enum collisions,
# ComCcsdsConfig.fpp missing aggregator entries) - see README.md's
# "Deployment config overrides" section for why. Upstream has never fixed
# either at any commit or tag (checked directly), so this fork is pinned
# indefinitely rather than tracking upstream.
deployment_cookiecutter: https://github.com/LucaLanzi/fprime-arduino-deployment-cookiecutter.git

default_cmake_options:  FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                        FPRIME_ENABLE_AUTOCODER_UTS=OFF
